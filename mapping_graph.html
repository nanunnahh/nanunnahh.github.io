<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교육과정 지식 그래프 (Curriculum Knowledge Graph)</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- Vis.js -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-std: #fbbf24;
            /* Amber */
            --accent-unit: #38bdf8;
            /* Sky */
            --accent-content: #4ade80;
            /* Green */
            --accent-activity: #f472b6;
            /* Pink */
            --accent-element: #94a3b8;
            /* Slate */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Background Gradient */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            z-index: -1;
        }

        /* Container */
        #mynetwork {
            width: 100%;
            height: 100%;
            border: none;
            cursor: grab;
        }

        #mynetwork:active {
            cursor: grabbing;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            color: white;
            transition: all 0.3s ease;
        }

        /* Header */
        header.overlay {
            top: 20px;
            left: 90px;
            /* Moved right to accommodate home button */
            z-index: 10;
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 55px;
            /* Size similar to chat button */
            height: 55px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 1.8rem;
            z-index: 100;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            /* Glow effect with accent color */
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* Legend */
        .legend {
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* Detail Panel */
        .details-panel {
            top: 20px;
            right: 20px;
            width: 300px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            transform: translateX(120%);
            /* Hidden by default */
            z-index: 20;
        }

        .details-panel.active {
            transform: translateX(0);
        }

        .details-panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: var(--accent-unit);
        }

        .detail-row {
            margin-bottom: 15px;
        }

        .detail-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .detail-content {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .close-btn:hover {
            color: white;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: white;
            z-index: 100;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        /* Chatbot Widget */
        .chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .chat-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .chat-button:hover {
            transform: scale(1.1);
        }

        .chat-button svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        .chat-window {
            width: 350px;
            height: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            margin-bottom: 20px;
            display: none;
            /* Hidden by default */
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .chat-window.active {
            display: flex;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-header {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 1.1rem;
            color: white;
        }

        .chat-close {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message.bot {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px 15px;
            color: white;
            outline: none;
        }

        .chat-input::placeholder {
            color: #94a3b8;
        }

        .chat-send {
            background: none;
            border: none;
            color: #60a5fa;
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>

    <div class="background"></div>
    <div id="loading" class="loading">Loading Graph...</div>

    <a href="reading_strategy_home.html" class="home-btn" title="홈으로 이동">
        <img src="mapping_graph_home_button.png" alt="Home" style="width: 100%; height: 100%; object-fit: contain;">
    </a>

    <header class="overlay">
        <h1>교육과정 맵핑 그래프</h1>
        <p class="subtitle">사회과 교육과정 성취기준-단원-내용 구조화</p>
    </header>

    <div class="overlay legend">
        <div class="legend-item">
            <div class="dot" style="background: var(--accent-std); box-shadow: 0 0 10px var(--accent-std);"></div>성취기준
            (Achievement Standard)
        </div>
        <div class="legend-item">
            <div class="dot" style="background: var(--accent-unit); box-shadow: 0 0 10px var(--accent-unit);"></div>소단원
            (Sub-unit)
        </div>
        <div class="legend-item">
            <div class="dot" style="background: var(--accent-content); box-shadow: 0 0 10px var(--accent-content);">
            </div>학습 내용 (Content)
        </div>
        <div class="legend-item">
            <div class="dot" style="background: var(--accent-activity); box-shadow: 0 0 10px var(--accent-activity);">
            </div>학습 활동 (Activity)
        </div>
        <div class="legend-item">
            <div class="dot" style="background: var(--accent-element);"></div>내용 요소 (Content Element)
        </div>
    </div>

    <div id="detailsPanel" class="overlay details-panel">
        <button class="close-btn" onclick="closeDetails()">&times;</button>
        <h2 id="detailTitle">Node Title</h2>
        <div id="detailBody"></div>
    </div>

    <div id="mynetwork"></div>

    <!-- Chatbot Widget -->
    <div class="chat-widget">
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <h3>Graph AI Chat</h3>
                <button class="chat-close" onclick="toggleChat()">&times;</button>
            </div>
            <div class="chat-body" id="chatBody">
                <div class="message bot">안녕하세요! 이 그래프의 연결 구조(선)에 대해 질문해 주시면 답변해 드릴게요. (예: "인권의 의미와 연결된 것은?", "6사03-01")
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" class="chat-input" placeholder="질문을 입력하세요..."
                    onkeypress="handleEnter(event)">
                <button class="chat-send" onclick="sendMessage()">➤</button>
            </div>
        </div>
        <button class="chat-button" onclick="toggleChat()">
            <svg viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z" />
            </svg>
        </button>
    </div>

    <script type="text/javascript">
        // 1. Data Definition (Parsed from mapping.ttl)
        const dataEntities = {
            // Achievement Standards
            "Std_6sa03-01": { id: "Std_6sa03-01", type: "Standard", label: "[6사03-01]", fullText: "일상 사례에서 법의 의미와 역할을 이해하고, 헌법에 규정된 인권이 일상생활에서 구현되는 사례를 조사하여 인권 친화적 태도를 기른다.", source: "cite: 7" },
            "Std_6sa03-02": { id: "Std_6sa03-02", type: "Standard", label: "[6사03-02]", fullText: "일상생활에서 인권이 침해되는 사례를 찾아 그 해결 방안을 탐색하고, 인권을 보호하는 활동에 참여한다.", source: "cite: 8" },

            // Content Elements (Connecting Nodes)
            "Elem_HR_Meaning": { id: "Elem_HR_Meaning", type: "Element", label: "인권의 의미", cat: "지식" },
            "Elem_Const_HR": { id: "Elem_Const_HR", type: "Element", label: "헌법상 인권의 내용", cat: "지식" },
            "Elem_Law_Meaning": { id: "Elem_Law_Meaning", type: "Element", label: "법의 의미와 역할", cat: "지식" },
            "Elem_Law_Case": { id: "Elem_Law_Case", type: "Element", label: "법의 적용 사례", cat: "지식" },
            "Elem_Org_Separation": { id: "Elem_Org_Separation", type: "Element", label: "권력 분립", cat: "지식" },
            "Elem_Info_Analysis": { id: "Elem_Info_Analysis", type: "Element", label: "정보 수집 분석", cat: "기능" },
            "Elem_HR_Resolution": { id: "Elem_HR_Resolution", type: "Element", label: "인권 문제 해결", cat: "기능" },
            "Elem_Power_Inquiry": { id: "Elem_Power_Inquiry", type: "Element", label: "권력 분립 탐구", cat: "기능" },
            "Elem_Compliance": { id: "Elem_Compliance", type: "Element", label: "준법 태도", cat: "가치" },
            "Elem_Right_Responsibility": { id: "Elem_Right_Responsibility", type: "Element", label: "권리와 책임", cat: "가치" },
            "Elem_HR_Friendly": { id: "Elem_HR_Friendly", type: "Element", label: "인권 친화적 태도", cat: "가치" },
            "Elem_Critical_Attitude": { id: "Elem_Critical_Attitude", type: "Element", label: "비판적 태도", cat: "가치" },

            // Sub Units & Contents
            "SubUnit1": { id: "SubUnit1", type: "SubUnit", label: "1. 인권을 존중하는 삶", std: "Std_6sa03-02" },
            "SubUnit2": { id: "SubUnit2", type: "SubUnit", label: "2. 인권 보장과 헌법", std: "Std_6sa03-01" },
            "SubUnit3": { id: "SubUnit3", type: "SubUnit", label: "3. 법의 의미와 역할", std: "Std_6sa03-01" },
        };

        const contents = [
            // SubUnit 1
            { id: "Content1_1", subUnit: "SubUnit1", topic: "인권의 의미와 일상생활 속 인권", activity: "인권 하면 떠오르는 것 써보기, 누리고 있는 인권 써보기", links: ["Elem_HR_Meaning", "Elem_HR_Friendly"] },
            { id: "Content1_2", subUnit: "SubUnit1", topic: "인권 신장을 위해 노력했던 옛 사람들", activity: "홍길동전 인권 문제 쓰기, 역사 신문 만들기", links: ["Elem_HR_Meaning", "Elem_Info_Analysis"] },
            { id: "Content1_3", subUnit: "SubUnit1", topic: "생활 속 인권 보장 사례 및 실천 태도", activity: "인권 침해 사례 찾기, '에베레스트산 계단' 광고 분석", links: ["Elem_HR_Resolution", "Elem_HR_Friendly"] },
            { id: "Content1_4", subUnit: "SubUnit1", topic: "통합 학습 활동 (인권)", activity: "우리 반 인권 선언 및 카드 만들기", links: ["Elem_HR_Friendly", "Elem_HR_Resolution"] },

            // SubUnit 2
            { id: "Content2_1", subUnit: "SubUnit2", topic: "헌법의 의미와 인권", activity: "헌법 속 인권 내용 찾기, 그림 그리기", links: ["Elem_Const_HR"] },
            { id: "Content2_2", subUnit: "SubUnit2", topic: "인권 보장을 위한 헌법의 역할", activity: "학원 심야 교습 제한 의견 쓰기", links: ["Elem_Const_HR", "Elem_Info_Analysis"] },
            { id: "Content2_3", subUnit: "SubUnit2", topic: "국민의 기본권 (평등/자유 등)", activity: "기본권 적용 사례 찾기", links: ["Elem_Const_HR", "Elem_Info_Analysis"] },
            { id: "Content2_4", subUnit: "SubUnit2", topic: "국민의 의무", activity: "우리 가족의 생활 모습에서 의무 찾기", links: ["Elem_Right_Responsibility"] },
            { id: "Content2_5", subUnit: "SubUnit2", topic: "권리와 의무의 관계", activity: "갈등 사례 기사 읽고 생각 쓰기", links: ["Elem_Right_Responsibility", "Elem_HR_Friendly"] },

            // SubUnit 3
            { id: "Content3_1", subUnit: "SubUnit3", topic: "법의 정의", activity: "법 관련 상황 찾기", links: ["Elem_Law_Meaning"] },
            { id: "Content3_2", subUnit: "SubUnit3", topic: "생활 속 법 적용 사례", activity: "사례와 법 연결하기", links: ["Elem_Law_Case", "Elem_Info_Analysis"] },
            { id: "Content3_3", subUnit: "SubUnit3", topic: "법의 역할", activity: "권리 침해/사회 질서 문제 역할놀이", links: ["Elem_Law_Meaning", "Elem_HR_Resolution"] },
            { id: "Content3_4", subUnit: "SubUnit3", topic: "법을 준수하는 태도", activity: "준법 행동 쓰기, 캠페인 활동", links: ["Elem_Compliance"] },
            { id: "Content3_5", subUnit: "SubUnit3", topic: "통합 학습 활동 (법)", activity: "정의의 신 표현하기, 법 제안하기", links: ["Elem_Compliance", "Elem_Law_Meaning"] }
        ];

        // 2. Build Graph Data
        const nodes = [];
        const edges = [];
        const addedNodes = new Set();

        function addNode(id, group, label, meta = {}) {
            if (!addedNodes.has(id)) {
                nodes.push({ id, group, label, ...meta });
                addedNodes.add(id);
            }
        }

        // Add Standard Nodes (Center)
        Object.values(dataEntities).forEach(e => {
            if (e.type === "Standard") {
                addNode(e.id, "standard", e.label, {
                    title: e.fullText,
                    value: 40, // Size
                    font: { size: 16, color: '#fbbf24', face: 'Outfit', strokeWidth: 0 }
                });
            } else if (e.type === "SubUnit") {
                addNode(e.id, "subunit", e.label, {
                    value: 25,
                    font: { size: 14, color: '#38bdf8', face: 'Noto Sans KR' }
                });
                // Connect SubUnit to Standard
                edges.push({ from: e.std, to: e.id, length: 150, width: 2, color: { opacity: 0.5, color: '#94a3b8' } });
            } else if (e.type === "Element") {
                addNode(e.id, "element", e.label, {
                    value: 15,
                    title: e.cat,
                    shape: "dot",
                    color: "#64748b",
                    font: { size: 12, color: '#94a3b8' }
                });
            }
        });

        // Add Content & Activity Nodes
        contents.forEach(content => {
            // Content Node
            addNode(content.id, "content", content.topic, {
                value: 20,
                font: { size: 12, color: '#4ade80' }
            });
            // Connect Content to SubUnit
            edges.push({ from: content.subUnit, to: content.id, length: 100, color: { opacity: 0.3 } });

            // Activity Node (Child of Content)
            const actId = content.id + "_act";
            addNode(actId, "activity", "활동", {
                value: 10,
                title: content.activity,
                label: "활동", // Simplified label to reduce clutter
                font: { size: 10, color: '#f472b6' }
            });
            edges.push({ from: content.id, to: actId, length: 50, color: { opacity: 0.3, style: 'dash' } });

            // Link Content to Elements
            if (content.links) {
                content.links.forEach(linkId => {
                    // Ensure element exists (it should)
                    if (dataEntities[linkId]) {
                        edges.push({ from: content.id, to: linkId, length: 150, dashes: true, color: { opacity: 0.2, color: '#ffffff' } });
                    }
                });
            }
        });

        // 3. Visualization Setup
        const container = document.getElementById('mynetwork');
        const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
        const options = {
            nodes: {
                shape: 'dot',
                borderWidth: 0,
                shadow: true,
                font: {
                    strokeWidth: 2,
                    strokeColor: '#0f172a'
                }
            },
            groups: {
                standard: { color: { background: '#fbbf24', border: '#fbbf24' }, shadow: { color: '#fbbf24', size: 15, x: 0, y: 0 } },
                subunit: { color: { background: '#38bdf8', border: '#38bdf8' } },
                content: { color: { background: '#4ade80', border: '#4ade80' } },
                activity: { color: { background: '#f472b6', border: '#f472b6' } },
                element: { color: { background: '#94a3b8', border: '#94a3b8' } }
            },
            edges: {
                width: 1,
                smooth: {
                    type: 'continuous'
                }
            },
            physics: {
                forceAtlas2Based: {
                    gravitationalConstant: -100,
                    centralGravity: 0.005,
                    springLength: 150,
                    springConstant: 0.18
                },
                maxVelocity: 50,
                solver: 'forceAtlas2Based',
                timestep: 0.35,
                stabilization: {
                    enabled: true,
                    iterations: 1000,
                    updateInterval: 25
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 200,
                zoomView: true
            }
        };

        const network = new vis.Network(container, data, options);

        // 4. Interaction Logic
        network.on("stabilizationIterationsDone", function () {
            document.getElementById('loading').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 500);
        });

        network.on("click", function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = nodes.find(n => n.id === nodeId);
                if (node) {
                    showDetails(node);
                }
            } else {
                closeDetails();
            }
        });

        function showDetails(node) {
            const panel = document.getElementById('detailsPanel');
            const title = document.getElementById('detailTitle');
            const body = document.getElementById('detailBody');

            // Find full data object if possible
            let contentHtml = "";

            if (node.group === "standard") {
                const entity = dataEntities[node.id];
                title.innerText = "성취기준: " + entity.label;
                title.style.color = "#fbbf24";
                contentHtml = `
                    <div class="detail-row">
                        <div class="detail-label">내용 (Description)</div>
                        <div class="detail-content">${entity.fullText}</div>
                    </div>
                `;
            } else if (node.group === "subunit") {
                const entity = dataEntities[node.id];
                title.innerText = "소단원: " + entity.label;
                title.style.color = "#38bdf8";
                contentHtml = `
                    <div class="detail-row">
                        <div class="detail-label">상위 성취기준</div>
                        <div class="detail-content">${dataEntities[entity.std].label}</div>
                    </div>
                `;
            } else if (node.group === "content") {
                const contentData = contents.find(c => c.id === node.id);
                title.innerText = "학습 내용";
                title.style.color = "#4ade80";
                contentHtml = `
                    <div class="detail-row">
                        <div class="detail-label">주제 (Topic)</div>
                        <div class="detail-content">${contentData.topic}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">관련 활동</div>
                        <div class="detail-content">${contentData.activity}</div>
                    </div>
                `;
            } else if (node.group === "activity") {
                const parentId = edges.find(e => e.to === node.id).from;
                const contentData = contents.find(c => c.id === parentId);
                title.innerText = "학습 활동";
                title.style.color = "#f472b6";
                contentHtml = `
                    <div class="detail-row">
                        <div class="detail-label">활동 내용</div>
                        <div class="detail-content">${contentData.activity}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">관련 주제</div>
                        <div class="detail-content">${contentData.topic}</div>
                    </div>
                `;
            } else if (node.group === "element") {
                const entity = dataEntities[node.id];
                title.innerText = "내용 요소: " + entity.label;
                title.style.color = "#94a3b8";
                contentHtml = `
                    <div class="detail-row">
                        <div class="detail-label">카테고리</div>
                        <div class="detail-content">${entity.cat}</div>
                    </div>
                 `;
            }

            body.innerHTML = contentHtml;
            panel.classList.add('active');
        }

        function closeDetails() {
            document.getElementById('detailsPanel').classList.remove('active');
        }

        // Chatbot Logic
        function toggleChat() {
            const chatWindow = document.getElementById('chatWindow');
            chatWindow.classList.toggle('active');
            if (chatWindow.classList.contains('active')) {
                document.getElementById('chatInput').focus();
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            // Process query
            setTimeout(() => {
                const response = processQuery(message);
                addMessage(response, 'bot');
            }, 500);
        }

        function addMessage(text, type) {
            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.innerText = text;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function processQuery(query) {
            // Normalize query
            const q = query.toLowerCase();

            // 1. Find matching nodes based on label or title
            const allEntities = [];

            // Add Standards, Elements, SubUnits form dataEntities
            Object.values(dataEntities).forEach(e => {
                allEntities.push({ id: e.id, label: e.label, text: e.fullText || e.cat });
            });
            // Add Contents
            contents.forEach(c => {
                allEntities.push({ id: c.id, label: c.topic, text: c.activity });
            });

            const foundNodes = allEntities.filter(e =>
                (e.label && e.label.toLowerCase().includes(q)) ||
                (e.text && e.text.toLowerCase().includes(q))
            );

            if (foundNodes.length === 0) {
                return "죄송합니다. 질문하신 내용과 관련된 노드를 찾을 수 없습니다. 정확한 명칭이나 키워드로 질문해 주세요."; // No matching nodes
            }

            // 2. For each found node, find its connections
            let responseParts = [];

            foundNodes.slice(0, 3).forEach(node => { // Limit to top 3 matches to avoid spam
                const connectedEdges = edges.filter(e => e.from === node.id || e.to === node.id);

                if (connectedEdges.length > 0) {
                    let part = `'${node.label}'은(는) 다음 항목들과 연결되어 있습니다:\n`;
                    const targets = connectedEdges.map(e => {
                        const targetId = e.from === node.id ? e.to : e.from;
                        // Find label for targetId
                        let targetLabel = targetId;
                        if (dataEntities[targetId]) targetLabel = dataEntities[targetId].label;
                        else {
                            const c = contents.find(x => x.id === targetId);
                            if (c) targetLabel = c.topic;
                            else if (targetId.endsWith('_act')) targetLabel = "관련 활동";
                        }
                        return `- ${targetLabel}`;
                    }).join('\n');
                    responseParts.push(part + targets);
                } else {
                    responseParts.push(`'${node.label}'은(는) 연결된 항목이 없습니다.`);
                }
            });

            return responseParts.join('\n\n');
        }

    </script>
