    <p>
      <strong>독서전략은 왜 가르쳐야 할까요?</strong><br>
      읽기는 모든 교과 학습의 바탕이자, 자연스럽게 익혀지는 능력이 아니라 <strong>'가르쳐야 할 기술'</strong>이에요.<br>
      적절한 독서전략을 학습 과제 해결에 계속적으로 대입해서 연습하다 보면<br>
      “다 읽었는데 무슨 내용인지 잘 모르겠어요.”라고 말하던 학생들이<br>
      “여기서 중요한 건 이거 같아요.”, “앞에서 나온 내용이랑 연결돼요.”라고 말할 수 있어요.
    </p>

          "https://images.twinkl.co.uk/tw1n/image/private/s--Ad2YYoVy--/e_sharpen:100,q_auto:eco,w_1260/image_repo/a3/ce/cfe-l-52554-scottish-history-skimming-and-scanning-activity-sheet_ver_1.webp",
          "https://www.eslprintables.com/previews/437471_1-Skimming.jpg"
        ],
        more: [
          ["스키밍이란 무엇인가요?(speako.club)",
            "https://speako.club/english-reading-skills/skimming-what-is"],
          ["독서 기술 7가지(스키밍 설명 포함, 티스토리)",
            "https://moneyfactory99.tistory.com/8"],
          ["Skimming 개념(위키백과)",
            "https://en.wikipedia.org/wiki/Skimming_(reading)"]
        ],
        worksheet:
          `[훑어 읽기 활동 예시]

1) 제목·소제목·차례를 먼저 보고, 글의 주제를 1문장으로 추측해요.
2) 각 문단의 첫 문장만 읽으며 ‘문단의 역할’을 메모해요. (설명/예시/주장/결론)
3) 굵은 글씨·표·그림 캡션을 확인해 핵심 키워드를 5개 뽑아요.
4) 글 전체의 흐름을 ‘3줄 요약’으로 먼저 만들어 봐요.
5) 정독이 필요한 부분(어려운 문단/핵심 문단)을 표시하고, 읽기 계획을 세워요.
6) 마지막으로 “훑어 읽기 후 내 예상 주제 vs 정독 후 주제”를 비교해 정리해요.`
      }

    ];  // ✅ 배열 닫기 (딱 한 번!)

    /* ===== 이미지 캐러셀 + 화면 동작 ===== */
    const menu = document.getElementById("menu");
    const title = document.getElementById("title");
    const definition = document.getElementById("definition");
    const source = document.getElementById("source");
    const more = document.getElementById("more");
    const worksheet = document.getElementById("worksheet");

    const exampleBox = document.getElementById("exampleBox");
    const exampleImage = document.getElementById("exampleImage");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentImages = [];
    let imgIndex = 0;

    function renderImage() {
      if (!currentImages || currentImages.length === 0) {
        exampleBox.style.display = "none";
        return;
      }
      exampleBox.style.display = "flex";
      exampleImage.src = currentImages[imgIndex];
    }

    prevBtn.onclick = () => {
      imgIndex = (imgIndex - 1 + currentImages.length) % currentImages.length;
      renderImage();
    };
    nextBtn.onclick = () => {
      imgIndex = (imgIndex + 1) % currentImages.length;
      renderImage();
    };

    let firstStrategyButton = null;

    strategies.forEach((s, index) => {
      const b = document.createElement("button");
      b.textContent = s.name;
      b.onclick = () => {
        title.textContent = s.name;
        definition.textContent = s.definition;
        source.textContent = "출처: " + s.source;

        // 이미지
        currentImages = s.exampleImages || [];
        imgIndex = 0;
        renderImage();

        // 더 알고 싶어요
        if (s.more && s.more.length > 0) {
          more.innerHTML = "<ul>" + s.more.map(m =>
            `<li>${m[0]} → <a href="${m[1]}" target="_blank" rel="noopener">관련 자료 바로가기</a></li>`
          ).join("") + "</ul>";
        } else {
          more.innerHTML = "";
        }

        worksheet.textContent = s.worksheet;
      };
      menu.appendChild(b);
      if (index === 0) firstStrategyButton = b;
    });

    // 첫 화면: 1번 전략 자동 표시
    if (firstStrategyButton) {
      firstStrategyButton.click();
    }
  </script>

</body>

</html>
