<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사회 ON 독서 ON</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-color: #333;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --hover-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 90%;
            max-width: 1200px;
            padding: 1rem;
        }

        .menu-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            position: relative;
            overflow: hidden;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--accent-color), #8e44ad);
            transform: scaleX(0);
            transition: transform 0.3s ease;
            transform-origin: left;
        }

        .menu-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--hover-shadow);
        }

        .menu-card:hover::before {
            transform: scaleX(1);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .card-desc {
            font-size: 1rem;
            color: #7f8c8d;
            line-height: 1.5;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .menu-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>사회 ON 독서 ON</h1>
        <p class="subtitle">상호작용 학습 리소스</p>
    </header>

    <div class="menu-container">
        <a href="reading.html" class="menu-card">
            <div class="icon">📖</div>
            <div class="card-title">읽기 자료</div>
            <div class="card-desc">인권에 대한 핵심 개념과 읽기 자료를 탐구해보세요.</div>
        </a>

        <a href="mapping_graph.html" class="menu-card">
            <div class="icon">📊</div>
            <div class="card-title">매핑 & 그래프</div>
            <div class="card-desc">인권 연구의 데이터와 연결성을 시각화하고, 챗봇을 통해 연결 구조를 질문해보세요.</div>
        </a>

        <a href="Reading_Strategy_AI_Assistant.html" class="menu-card">
            <div class="icon">🤖</div>
            <div class="card-title">AI 도우미</div>
            <div class="card-desc">학습 여정을 위한 가이드와 전략을 지원받으세요.</div>
        </a>
    </div>

</body>

</html>
