<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 기반 독서전략 융합수업 설계 어시스턴트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* [기존 디자인 유지] */
        :root {
            --primary-color: #1e293b;
            --accent-color: #6366f1;
            --bg-color: #f8fafc;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: #334155;
            line-height: 1.6;
        }

        h1,
        h2,
        h3 {
            font-family: 'Noto Serif KR', serif;
            letter-spacing: -0.02em;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
            border-radius: 24px;
        }

        .input-elegant {
            background-color: #f1f5f9;
            border: 1px solid transparent;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
        }

        .input-elegant:focus {
            background-color: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            outline: none;
        }

        .option-card {
            cursor: pointer;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 1.25rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-card.selected {
            border-color: var(--accent-color);
            background-color: #eef2ff;
        }

        .option-card input[type="radio"] {
            display: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            color: white;
            border-radius: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.3);
        }

        /* [워드 서식 강화] */
        .prose h1 {
            font-family: 'Noto Serif KR', serif;
            color: #1e3a8a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 1rem;
            font-size: 1.8rem;
            margin-top: 2rem;
        }

        .prose h2 {
            font-family: 'Noto Sans KR', sans-serif;
            color: #1e40af;
            background: linear-gradient(to right, #eff6ff, transparent);
            padding: 0.75rem 1rem;
            border-left: 4px solid #3b82f6;
            margin-top: 2rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1.3rem;
        }

        .prose p {
            margin-bottom: 1rem;
            text-align: justify;
            word-break: keep-all;
            color: #374151;
        }

        .prose table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }

        .prose th {
            background-color: #f8fafc;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .prose td {
            padding: 1rem;
            border: 1px solid #e2e8f0;
            vertical-align: top;
        }
    </style>

    <script>
        // ▼▼▼ [필수] 아까 새로 만든 키를 그대로 쓰세요 (Lite 모델은 횟수가 남아있습니다) ▼▼▼
        const API_KEY = "AIzaSyCl43OCcAZPKevST0ybtQFu0oYf19muvRs";

        const KNOWLEDGE_BASE = `
        [1. 독서 전략 온톨로지]
        - 구조: 3차원 큐브 구조 (독서 과정 × 텍스트 구조 × 텍스트 종류)
        - 주요 전략: SQ3R(전 과정), 마인드맵(조직화), 예측 안내하기(독서 전), 요약하기(독서 후)

        [2. 가네의 9가지 수업사태]
        1. 주의 집중 2. 수업 목표 제시 3. 선행 학습 상기
        4. 자극 자료 제시 5. 학습 안내 6. 성취 수행 유도
        7. 피드백 제공 8. 수행 평가 9. 파지 및 전이
        `;

        async function generatePlan() {
            const standard = document.getElementById('standard').value;
            const explanation = document.getElementById('explanation').value;
            const consideration = document.getElementById('consideration').value;
            const planMode = document.querySelector('input[name="planMode"]:checked').value;
            const customRequest = document.getElementById('customRequest').value;
            const fileInput = document.getElementById('mediaFile');
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!standard) { alert("성취기준을 입력해주세요!"); return; }
            if (API_KEY.includes("YOUR_API_KEY")) { alert("API 키를 입력해주세요!"); return; }

            loadingDiv.classList.remove('hidden');
            resultDiv.innerHTML = "";
            resultDiv.classList.add('hidden');
            downloadBtn.classList.add('hidden');
            loadingDiv.scrollIntoView({ behavior: 'smooth' });

            try {
                let modeInstruction = "";
                if (planMode === "integrated") modeInstruction = `[모드: 주제 융합] 핵심 주제를 선정하여 단일 프로젝트 수업안 작성.`;
                else if (planMode === "individual") modeInstruction = `[모드: 개별] 성취기준별 독립 수업안 작성.`;
                else if (planMode === "custom") modeInstruction = `[모드: 사용자 요청] 반영: "${customRequest}"`;

                let textPrompt = `
                    당신은 'AI 기반 독서전략 융합수업 설계 어시스턴트'입니다.
                    ${KNOWLEDGE_BASE}
                    
                    [교육과정 정보]
                    - 성취기준: ${standard}
                    - 해설: ${explanation}
                    - 고려사항: ${consideration}
                    ${modeInstruction}

                    [작성 필수 지침 - 엄격 준수]
                    1. **제목**: 로봇 아이콘 없이 수업 주제를 매력적으로 정해 최상단에 표시(<h1>).
                    2. **독서전략 섹션**:
                       - 제목은 반드시 <h2>독서전략 선정 이유 및 설명</h2>으로 작성하세요.
                       - 내용은 불렛 포인트(목록)를 쓰지 말고, **2~3개의 명확한 문단(<p>)으로 나누어 줄글 형태로** 서술하세요.
                    3. **수업 흐름**: 가네의 9가지 사태를 표(table)로 작성하고 '비계 전략'을 명시하세요.
                    4. **평가 루브릭 제외**: 루브릭이나 평가표는 절대 작성하지 마세요.
                    5. **실제 쪽수**: 업로드된 자료가 있다면 실제 인쇄된 교과서 쪽수를 언급하세요.
                    6. **형식**: HTML 태그(h1, h2, table, th, td, p, br)만 사용하세요.
                `;

                let contents = [{ parts: [{ text: textPrompt }] }];

                if (fileInput.files.length > 0) {
                    const base64Data = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.readAsDataURL(fileInput.files[0]);
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                    });
                    contents[0].parts.push({ inline_data: { mime_type: fileInput.files[0].type, data: base64Data } });
                }

                // ★ 안전 필터 해제 (중요) ★
                const safetySettings = [
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                ];

                // ★ 모델 긴급 변경: gemini-2.5-flash-lite ★
                // (선생님 계정에서 아직 사용량이 0/20으로 쌩쌩한 유일한 모델입니다!)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: contents, safetySettings: safetySettings })
                });

                const data = await response.json();

                if (data.error) throw new Error(`[API 오류] ${data.error.message}`);
                if (!data.candidates || data.candidates.length === 0) throw new Error("AI 응답이 차단되었거나 서버가 응답하지 않습니다.");
                if (!data.candidates[0].content) throw new Error("생성된 내용이 비어있습니다. 다시 시도해주세요.");

                let formattedText = data.candidates[0].content.parts[0].text
                    .replace(/```html/g, '').replace(/```/g, '')
                    .replace(/\n\s*\n/g, '\n').replace(/(>)\n/g, '$1').replace(/([^>])\n/g, '$1<br>');

                resultDiv.innerHTML = formattedText;
                resultDiv.classList.remove('hidden');
                downloadBtn.classList.remove('hidden');
            } catch (error) {
                resultDiv.innerHTML = `<div class="p-6 bg-red-50 text-red-700 text-center rounded-xl border border-red-200">
                    <p class="font-bold text-lg">🚨 오류 발생</p>
                    <p class="text-sm mt-2">${error.message}</p>
                    <p class="text-xs text-gray-500 mt-2">API 키가 정확한지, 인터넷 연결이 되어있는지 확인해주세요.</p>
                    </div>`;
                resultDiv.classList.remove('hidden');
            } finally {
                loadingDiv.classList.add('hidden');
            }
        }

        function saveAsWord() {
            const content = document.getElementById('result').innerHTML;
            const wordStyles = `
                <style>
                    body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; line-height: 1.6; }
                    h1 { color: #1e3a8a; text-align: center; font-size: 20pt; margin-bottom: 20px; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; }
                    h2 { color: #1e40af; background-color: #f0f9ff; padding: 10px; border-left: 8px solid #3b82f6; font-size: 14pt; margin-top: 30px; margin-bottom: 15px; }
                    p { margin-bottom: 10px; text-align: justify; font-size: 11pt; line-height: 1.8; }
                    table { border-collapse: collapse; width: 100%; margin: 20px 0; border: 1px solid #000000; }
                    th { background-color: #f3f4f6; border: 1px solid #000000; padding: 10px; font-weight: bold; text-align: center; font-size: 11pt; }
                    td { border: 1px solid #000000; padding: 10px; vertical-align: top; font-size: 10.5pt; text-align: left; }
                </style>
            `;
            const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'><title>수업계획안</title>${wordStyles}</head><body>`;
            const footer = "</body></html>";
            const blob = new Blob(['\ufeff', header + content + footer], { type: 'application/msword' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'AI_수업계획안.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            const previewArea = document.getElementById('filePreviewArea');
            if (file) {
                previewArea.innerHTML = `<div class="mt-4 flex items-center gap-3 bg-green-50 p-4 rounded-xl border border-green-200 shadow-sm animate-fade-in"><div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center text-lg">✅</div><div><p class="text-sm font-bold text-gray-800">파일 탑재 완료!</p><p class="text-xs text-gray-500 truncate max-w-[200px]">${file.name}</p></div></div>`;
            }
        }

        function selectMode(element) {
            document.querySelectorAll('.option-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
            element.querySelector('input').checked = true;
            const customInputArea = document.getElementById('customInputArea');
            if (document.getElementById('modeCustom').checked) customInputArea.classList.remove('hidden');
            else customInputArea.classList.add('hidden');
        }
    </script>
</head>

<body class="py-12 px-4 md:px-0 bg-slate-50 min-h-screen">
    <a href="reading_strategy_home.html"
        class="absolute top-6 left-6 bg-white p-3 rounded-full shadow-lg text-slate-700 hover:bg-slate-50 transition z-50 flex items-center justify-center"
        title="홈으로 이동">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
            <path
                d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.707 1.5Z" />
        </svg>
    </a>
    <div class="max-w-5xl mx-auto space-y-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold text-slate-800 mb-4 tracking-tight"
                style="font-family: 'Noto Serif KR', serif;">
                AI 기반 <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">독서전략
                    융합수업</span> 설계 어시스턴트
            </h1>
            <p class="text-lg text-slate-500 font-medium">
                독서전략 온톨로지와 가네의 수업사태를 활용하여 교과 수업에 적용하는 전문적인 수업계획안을 설계해드립니다.
            </p>
        </header>

        <div class="glass-panel p-8 md:p-10 space-y-10">
            <section>
                <div class="flex items-center gap-3 mb-6">
                    <span
                        class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-800 text-white font-bold text-sm">1</span>
                    <h2 class="text-2xl font-bold text-slate-800">교육과정 정보 입력</h2>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="col-span-1 lg:col-span-2">
                        <label class="block text-sm font-bold text-slate-600 mb-2">① 성취기준 *</label>
                        <textarea id="standard" class="w-full p-4 h-24 input-elegant text-sm resize-none"
                            placeholder="[6사03-01] 성취기준 내용을 입력하세요..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-2">② 성취기준 해설</label>
                        <textarea id="explanation" class="w-full p-4 h-32 input-elegant text-sm resize-none"
                            placeholder="(선택)"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-2">③ 고려사항</label>
                        <textarea id="consideration" class="w-full p-4 h-32 input-elegant text-sm resize-none"
                            placeholder="(선택)"></textarea>
                    </div>
                </div>
            </section>

            <hr class="border-slate-200">

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                <section>
                    <div class="flex items-center gap-3 mb-6">
                        <span
                            class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-800 text-white font-bold text-sm">2</span>
                        <h2 class="text-xl font-bold text-slate-800">설계 방식 선택</h2>
                    </div>
                    <div class="space-y-4">
                        <div class="option-card selected" onclick="selectMode(this)">
                            <input type="radio" name="planMode" value="integrated" checked>
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">🔗</span>
                                <div>
                                    <p class="font-bold text-slate-800">융합형 프로젝트</p>
                                    <p class="text-xs text-slate-500">성취기준이 여러 개일 때 활용</p>
                                </div>
                            </div>
                        </div>
                        <div class="option-card" onclick="selectMode(this)">
                            <input type="radio" name="planMode" value="individual">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">📑</span>
                                <div>
                                    <p class="font-bold text-slate-800">개별형 수업</p>
                                    <p class="text-xs text-slate-500">단일 성취기준에 집중할 때 활용</p>
                                </div>
                            </div>
                        </div>
                        <div class="option-card" onclick="selectMode(this)">
                            <input type="radio" name="planMode" value="custom" id="modeCustom">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">✏️</span>
                                <div>
                                    <p class="font-bold text-slate-800">사용자 맞춤 요청</p>
                                    <p class="text-xs text-slate-500">직접 내용을 입력합니다.</p>
                                </div>
                            </div>
                        </div>
                        <div id="customInputArea" class="hidden animate-fade-in-down pt-2">
                            <textarea id="customRequest" class="w-full p-3 input-elegant text-sm h-24 resize-none"
                                placeholder="예: 7차시 프로젝트로 짜줘."></textarea>
                        </div>
                    </div>
                </section>

                <section>
                    <div class="flex items-center gap-3 mb-6">
                        <span
                            class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-800 text-white font-bold text-sm">3</span>
                        <h2 class="text-xl font-bold text-slate-800">자료 분석</h2>
                    </div>
                    <label id="dropzone"
                        class="cursor-pointer flex flex-col items-center justify-center h-64 border-2 border-dashed border-slate-300 rounded-2xl hover:border-indigo-400 hover:bg-slate-50 transition duration-300 group">
                        <div class="flex items-center gap-4 mb-3">
                            <span class="text-4xl group-hover:scale-110 transition-transform">📸</span>
                            <span class="text-4xl group-hover:scale-110 transition-transform">📄</span>
                        </div>
                        <p class="font-bold text-slate-600">수업 자료 업로드</p>
                        <p class="text-xs text-slate-400 mt-1">교과서 촬영 사진 또는 파일</p>
                        <input type="file" id="mediaFile" accept="image/*, application/pdf" class="hidden"
                            onchange="handleFileSelect(event)">
                    </label>
                    <div id="filePreviewArea"></div>
                </section>
            </div>

            <button onclick="generatePlan()"
                class="w-full btn-primary py-5 font-bold text-lg tracking-wide shadow-xl mt-4">
                ✨ 수업계획안 생성하기
            </button>
        </div>

        <div id="loading" class="hidden flex flex-col items-center justify-center py-20">
            <div class="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
            <p class="mt-6 text-indigo-900 font-bold text-lg animate-pulse">AI가 수업을 설계하고 있습니다...</p>
        </div>

        <div class="mt-8 px-4 pb-12">
            <button id="downloadBtn" onclick="saveAsWord()"
                class="hidden mx-auto mb-10 bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-4 rounded-full font-bold shadow-lg transition transform hover:-translate-y-1 flex items-center gap-2">
                <span>💾</span> Word 파일로 저장하기
            </button>
            <div id="result"
                class="prose max-w-5xl mx-auto bg-white p-12 rounded-2xl shadow-xl border border-slate-100 hidden">
            </div>
        </div>
    </div>
</body>

</html>
