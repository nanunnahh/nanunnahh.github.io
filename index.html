<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신문 사설 검색 (Editorial Search)</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts for Korean Support and Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="header-content">
            <h1>신문 사설 검색</h1>
            <p>Editorial Search Engine</p>
        </div>
    </header>

    <main>
        <section class="search-container">
            <div class="search-card">
                <h2>검색 조건 입력</h2>
                <div class="input-group">
                    <label for="search-background">Background (배경)</label>
                    <input type="text" id="search-background" placeholder="배경 내용을 입력하세요...">
                </div>
                <div class="input-group">
                    <label for="search-evidence">Evidence (증거)</label>
                    <input type="text" id="search-evidence" placeholder="증거 내용을 입력하세요...">
                </div>
                <div class="input-group">
                    <label for="search-argument">Argument (주장)</label>
                    <input type="text" id="search-argument" placeholder="주장 내용을 입력하세요...">
                </div>
                <div class="input-group">
                    <label for="search-fact">Fact (사실)</label>
                    <input type="text" id="search-fact" placeholder="사실 내용을 입력하세요...">
                </div>
                <button id="search-btn">검색하기</button>
            </div>
        </section>

        <section class="results-container">
            <div id="results-header">
                <h3>검색 결과 <span id="result-count">0</span>건</h3>
            </div>
            <div id="results-list">
                <!-- Results will be injected here via JS -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Editorial Search. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
