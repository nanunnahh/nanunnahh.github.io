<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신문 사설 검색 (Editorial Search)</title>

    <!-- Google Fonts for Korean Support and Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- Internal CSS (Combined for Portability) -->
    <style>
        /* CSS Reset & Normalize */
        html {
            -webkit-text-size-adjust: 100%;
            -moz-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            font-family: 'Noto Sans KR', 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f7fa;
            --text-color: #333;
            --accent-color: #e94e77;
            --card-bg: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 10px 20px rgba(0, 0, 0, 0.15);
            --border-radius: 12px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 1rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* Main Layout */
        main {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Search Section */
        .search-container {
            display: flex;
            justify-content: center;
        }

        .search-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 800px;
        }

        .search-card h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            font-size: 1.5rem;
            text-align: center;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #444;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: #fff;
            appearance: none;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        #search-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 1rem;
            font-family: inherit;
        }

        #search-btn:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        #search-btn:active {
            transform: translateY(0);
        }

        /* Results Section */
        .results-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        #results-header {
            margin-bottom: 1rem;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #results-header h3 {
            font-size: 1.2rem;
            color: #444;
            font-weight: 600;
        }

        #results-list {
            display: grid;
            gap: 1.5rem;
        }

        /* Initial State Placeholder */
        .initial-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #888;
            background: #fff;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px dashed #ccc;
        }

        .initial-state p {
            font-size: 1.1rem;
        }

        /* Result Item Card */
        .editorial-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--primary-color);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .editorial-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .editorial-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }

        .editorial-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0.4rem;
            letter-spacing: -0.01em;
        }

        .editorial-meta {
            font-size: 0.9rem;
            color: #7f8c8d;
            font-weight: 400;
        }

        .editorial-content {
            display: grid;
            gap: 1rem;
        }

        .content-row {
            display: flex;
            flex-direction: column;
        }

        .content-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
            color: var(--primary-color);
        }

        .content-text {
            font-size: 1rem;
            color: #4a4a4a;
            background-color: #f8f9fa;
            padding: 0.9rem;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            word-break: keep-all;
            line-height: 1.7;
        }

        /* Specific colors for different fields/tags */
        .content-row.background .content-label {
            color: #d35400;
        }

        .content-row.evidence .content-label {
            color: #27ae60;
        }

        .content-row.argument .content-label {
            color: #8e44ad;
        }

        .content-row.fact .content-label {
            color: #2980b9;
        }

        /* Footer */
        footer {
            background-color: #34495e;
            color: #bdc3c7;
            text-align: center;
            padding: 2rem 1rem;
            margin-top: auto;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 2rem 1rem;
            }

            header h1 {
                font-size: 2rem;
            }

            main {
                padding: 1.5rem 1rem;
            }

            .search-card {
                padding: 1.5rem;
            }

            .editorial-card {
                padding: 1.2rem;
            }
        }
    </style>
</head>

                <div class="input-group">
                    <label for="search-fact">Fact (사실)</label>
                    <input type="text" id="search-fact" placeholder="사실 내용을 입력하세요...">

                <button id="search-btn">검색하기</button>

    <structure>
      <background><![CDATA[미중 패권 경쟁 심화로 글로벌 반도체 공급망이 재편되면서 한국 반도체 산업이 샌드위치 위기에 처했다.]]></background>
      <evidence><![CDATA[경쟁국들은 천문학적인 보조금을 지급하며 자국 반도체 생태계를 육성하고 있다.]]></evidence>
      <argument><![CDATA[세제 혜택 확대와 인프라 지원을 통해 기업의 R&D 투자를 유도하고 초격차 기술 경쟁력을 확보해야 한다.]]></argument>
      <fact><![CDATA[메모리 반도체 분야에서 경쟁국과의 기술 격차가 1년 이내로 좁혀졌다는 분석이 나왔다.]]></fact>
    </structure>
  </editorial>
</editorials>`;

        document.addEventListener('DOMContentLoaded', () => {
            const searchBtn = document.getElementById('search-btn');
            const inputs = {
                background: document.getElementById('search-background'),
                evidence: document.getElementById('search-evidence'),
                argument: document.getElementById('search-argument'),
                fact: document.getElementById('search-fact')
            };
            const resultsContainer = document.getElementById('results-list');
            const resultCountSpan = document.getElementById('result-count');

            let editorials = [];

            // Parse XML Data Directly
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlData, "text/xml");
                const parseError = xmlDoc.getElementsByTagName("parsererror");

                if (parseError.length > 0) {
                    throw new Error("XML Parsing Failure");
                }

                editorials = parseEditorials(xmlDoc);
                console.log(`Loaded ${editorials.length} editorials.`);
            } catch (err) {
                console.error('Error parsing XML:', err);
                resultsContainer.innerHTML = `<p style="text-align:center; color:red;">XML 데이터를 처리하는 중 오류가 발생했습니다.<br>Error: ${err.message}</p>`;
            }

            // 초기 상태: 결과 영역 비우기 및 안내 메시지 표시
            resultsContainer.innerHTML = '<div class="initial-state"><p>원하는 검색어를 입력하고 <strong>검색하기</strong> 버튼을 눌러주세요.</p></div>';
            resultCountSpan.textContent = '0';

            function parseEditorials(xmlDoc) {
                const items = Array.from(xmlDoc.getElementsByTagName('editorial'));
                return items.map(item => {
                    const getTagText = (parent, tag) => {
                        const els = parent.getElementsByTagName(tag);
                        return els.length > 0 ? els[0].textContent.trim() : '';
                    };

                    const structure = item.getElementsByTagName('structure')[0];

                    const bg = structure ? getTagText(structure, 'background') : '';
                    const ev = structure ? getTagText(structure, 'evidence') : '';
                    const ag = structure ? getTagText(structure, 'argument') : '';
                    const fc = structure ? getTagText(structure, 'fact') : '';

                    return {
                        id: item.getAttribute('id'),
                        title: getTagText(item, 'title'),
                        author: getTagText(item, 'author'),
                        date: getTagText(item, 'date'),
                        background: bg,
                        evidence: ev,
                        argument: ag,
                        fact: fc
                    };
                });
            }

            function filterEditorials() {
                // 공백 제거 헬퍼 함수
                const normalize = (str) => str.replace(/\s+/g, '').toLowerCase();

                const queries = {
                    background: normalize(inputs.background.value),
                    evidence: normalize(inputs.evidence.value),
                    argument: normalize(inputs.argument.value),
                    fact: normalize(inputs.fact.value)
                };

                const filtered = editorials.filter(item => {
                    const itemBg = normalize(item.background);
                    const itemEv = normalize(item.evidence);
                    const itemAg = normalize(item.argument);
                    const itemFc = normalize(item.fact);

                    const matchBackground = !queries.background || itemBg.includes(queries.background);
                    const matchEvidence = !queries.evidence || itemEv.includes(queries.evidence);
                    const matchArgument = !queries.argument || itemAg.includes(queries.argument);
                    const matchFact = !queries.fact || itemFc.includes(queries.fact);

                    return matchBackground && matchEvidence && matchArgument && matchFact;
                });

                displayResults(filtered);
            }

            function displayResults(items) {
                resultCountSpan.textContent = items.length;
                resultsContainer.innerHTML = '';

                if (items.length === 0) {
                    resultsContainer.innerHTML = '<p style="text-align:center; padding:2rem; color:#888;">검색 결과가 없습니다.</p>';
                    return;
                }

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'editorial-card';

                    card.innerHTML = `
                <div class="editorial-header">
                    <div>
                        <h4 class="editorial-title">${item.title}</h4>
                        <div class="editorial-meta">${item.author} | ${item.date}</div>
                    </div>
                </div>
                <div class="editorial-content">
                    <div class="content-row background">
                        <span class="content-label">Background</span>
                        <div class="content-text">${highlightText(item.background, inputs.background.value)}</div>
                    </div>
                    <div class="content-row evidence">
                        <span class="content-label">Evidence</span>
                        <div class="content-text">${highlightText(item.evidence, inputs.evidence.value)}</div>
                    </div>
                    <div class="content-row argument">
                        <span class="content-label">Argument</span>
                        <div class="content-text">${highlightText(item.argument, inputs.argument.value)}</div>
                    </div>
                    <div class="content-row fact">
                        <span class="content-label">Fact</span>
                        <div class="content-text">${highlightText(item.fact, inputs.fact.value)}</div>
                    </div>
                </div>
            `;
                    resultsContainer.appendChild(card);
                });
            }

            function highlightText(text, query) {
                if (!query || !query.trim() || !text) return text;
                const q = query.trim();
                const regex = new RegExp(`(${q})`, 'gi');
                return text.replace(regex, '<span style="background-color: #fffacd; font-weight:bold; padding: 0 2px;">$1</span>');
            }

            // Event Listeners
            searchBtn.addEventListener('click', filterEditorials);

            // Enter key support
            Object.values(inputs).forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') filterEditorials();
                });
            });
        });
    </script>
</body>

</html>
